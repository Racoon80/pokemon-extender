# Pokemon-Extender — for an NVIDIA GPU with 12 GB VRAM or more
# (Unraid with the Compose Manager plugin: use unraid/docker-compose.yml instead.)
#
# Needs: Docker + NVIDIA driver + nvidia-container-toolkit
#   (Windows: Docker Desktop with the WSL2 backend, GPU support is built in)
# 1. Put your Hugging Face token below (HF_TOKEN).
# 2. docker compose up -d --build
# 3. http://localhost:8000 — the first start downloads the AI model (~15 GB) once; the page shows the progress.
services:
  pokemon-extender:
    build: .
    image: pokemon-extender:latest
    pull_policy: build                 # local image, never pulled from a registry
    container_name: pokemon-extender
    restart: unless-stopped
    ports:
      # This computer only. For your LAN use "8000:8000" — there is no login,
      # so never expose it to the internet (or put a reverse proxy with auth in front).
      - "127.0.0.1:8000:8000"
    environment:
      # Hugging Face token (read access) of an account that accepted the FLUX.1 Fill licence:
      # https://huggingface.co/black-forest-labs/FLUX.1-Fill-dev
      HF_TOKEN: "hf_PUT_YOUR_TOKEN_HERE"
      # 12 GB VRAM: Q5_K_S (8.3 GB) fits. Out of memory → flux1-fill-dev-Q4_K_S.gguf (6.8 GB).
      FLUX_GGUF_FILE: flux1-fill-dev-Q5_K_S.gguf
      TORCH_DTYPE: auto                # bf16 on RTX 30xx and newer, float32 on older cards
      CPU_OFFLOAD: auto                # switches on below 12 GB free VRAM
    volumes:
      - ./data:/data                   # AI model, results, own templates (data/templates/*.json)
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
