# Pokemon-Extender — print sheet + cut line for a finished slab picture. No GPU needed.
# (Unraid with the Compose Manager plugin: use unraid/docker-compose.yml instead.)
#
# docker compose up -d, then http://localhost:8000
# Update: docker compose pull && docker compose up -d
# Build it yourself instead: replace "image:" with "build: ." and run docker compose up -d --build
services:
  pokemon-extender:
    image: ghcr.io/racoon80/pokemon-extender:latest
    container_name: pokemon-extender
    restart: unless-stopped
    ports:
      # This computer only. For your LAN use "8000:8000" — there is no login,
      # so never expose it to the internet (or put a reverse proxy with auth in front).
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data                   # results, own templates (data/templates/*.json)
