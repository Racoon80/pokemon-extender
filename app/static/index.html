<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokemon Extender</title>
<style>
  :root { --bg:#f4f4f6; --panel:#fff; --text:#1d1d22; --muted:#6b6b76; --line:#dcdce2; --accent:#d22a33; --track:#e6e6ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141417; --panel:#1e1e23; --text:#ececf0; --muted:#9a9aa6; --line:#33333b; --track:#2c2c33; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px; display:grid; gap:20px; grid-template-columns:340px 1fr; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  h1 { font-size:20px; margin:0 0 4px; } p.sub { margin:0 0 16px; color:var(--muted); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input, select, textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  textarea { min-height:70px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { margin-top:16px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #thumb { display:none; margin-top:10px; max-height:180px; max-width:100%; border-radius:6px; border:1px solid var(--line); }
  #status { margin-top:10px; font-size:14px; color:var(--muted); min-height:1.4em; }
  #status.err { color:var(--accent); }
  .warn { font-size:13px; color:var(--accent); margin:10px 0 0; }
  .results { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px; }
  .results figure { margin:0; } .results img { width:100%; max-height:520px; object-fit:contain; border-radius:8px; border:1px solid var(--line); background:#fff; }
  .results.single { grid-template-columns:minmax(180px, 320px); }
  figcaption { font-size:13px; color:var(--muted); margin-top:4px; }
  .dl { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .dl a { padding:6px 10px; border:1px solid var(--line); border-radius:6px; color:var(--text); text-decoration:none; font-size:13px; }
  .dl a.cut { border-color:var(--accent); }
  .hint { font-size:13px; color:var(--muted); margin:10px 0 0; }
  .empty { color:var(--muted); text-align:center; padding:60px 10px; }
  .top { display:flex; justify-content:space-between; align-items:start; gap:12px; }
  .top select { width:auto; padding:4px 6px; font-size:13px; }
</style>
</head>
<body>
<main>
  <section>
    <div class="top">
      <h1>Pokémon Extender</h1>
      <select id="lang" aria-label="Language">
        <option value="en">English</option><option value="de">Deutsch</option>
        <option value="fr">Français</option><option value="lb">Lëtzebuergesch</option>
      </select>
    </div>
    <p class="sub" data-i18n="subtitle"></p>
    <form class="panel" id="f">
      <label data-i18n="card"></label>
      <input type="file" name="file" id="file" accept="image/*" required>
      <img id="thumb" alt="">
      <label data-i18n="template"></label><select name="template" id="template"></select>
      <label data-i18n="placement"></label>
      <select name="placement"><option value="center" data-i18n="plCenter"></option><option value="template" data-i18n="plTemplate"></option></select>
      <div class="row">
        <div><label data-i18n="bleed"></label><input name="bleed_mm" type="number" value="2" step="0.5" min="0" max="10"></div>
        <div><label>DPI</label><input name="dpi" type="number" value="260" min="72" max="600"></div>
      </div>
      <button id="go" data-i18n="go"></button>
      <div id="status"><span id="stage"></span></div>
    </form>
  </section>
  <section class="panel" id="out"><div class="empty" data-i18n="empty"></div></section>
</main>
<script>
const I18N = {
  en: {
    subtitle: 'Upload the finished picture with the card in it → print sheet in slab size and one cut line around it.',
    card: 'Picture (already extended, card inside)', template: 'Template',
    placement: 'Card position', plTemplate: 'Where the slab holds the card', plCenter: 'Centred',
    bleed: 'Bleed (mm)', go: 'Make print + cut line', empty: 'Nothing made yet.', uploaded: 'Uploaded picture',
    working: 'Working…', done: 'Done', error: 'Error: ',
    preview: 'Cut line ({w} × {h} mm)', print: 'Print ({w} × {h} mm incl. bleed, {dpi} dpi)',
    lowres: 'The picture only has {d} dpi at card size — the print will be soft.',
    missing: 'The picture does not reach the cut line ({sides}); that part is filled with blurred background.',
    top: 'top {v} mm', bottom: 'bottom {v} mm', left: 'left {v} mm', right: 'right {v} mm',
    dlPrintCut: 'Print + cut line (SVG)', dlPdf: 'PDF (print)', dlPng: 'PNG (print)', dlCutDxf: 'Cut line only (DXF)',
    dlCutout: 'Bambu Suite (PNG, transparent)', cutoutHint: 'Bambu Suite: import the transparent PNG and set it to Print Then Cut — the Suite cuts along its edge by itself, no cut file needed ({w} × {h} mm, no bleed).',
    cutHint: 'Print-then-cut (e.g. Bambu Suite): one file with the picture and the cut line on top of it, already aligned, in mm. There is only one cut: the slab outline.',
    e_no_card: 'No card found in the picture. The whole card has to be visible, with background around it.',
    e_not_image: 'That is not an image (or it is too large).', e_too_large: 'File too large (max. {max} MB).',
    e_out_of_range: 'A value is out of range.', e_unknown_option: 'Unknown template or position.',
    e_queue_full: 'Too busy right now, try again in a moment.',
  },
  de: {
    subtitle: 'Fertiges Bild mit der Karte darin hochladen → Druckbogen in Slab-Größe und eine Schnittlinie drumherum.',
    card: 'Bild (schon erweitert, Karte drin)', template: 'Vorlage',
    placement: 'Kartenposition', plTemplate: 'Wo der Slab die Karte hält', plCenter: 'Mittig',
    bleed: 'Beschnitt (mm)', go: 'Druck + Schnittlinie erstellen', empty: 'Noch nichts erstellt.', uploaded: 'Hochgeladenes Bild',
    working: 'Wird erstellt…', done: 'Fertig', error: 'Fehler: ',
    preview: 'Schnittlinie ({w} × {h} mm)', print: 'Druck ({w} × {h} mm inkl. Beschnitt, {dpi} dpi)',
    lowres: 'Das Bild hat bei Kartengröße nur {d} dpi — der Druck wird unscharf.',
    missing: 'Das Bild reicht nicht bis zur Schnittlinie ({sides}); dort wird unscharfer Hintergrund ergänzt.',
    top: 'oben {v} mm', bottom: 'unten {v} mm', left: 'links {v} mm', right: 'rechts {v} mm',
    dlPrintCut: 'Druck + Schnittlinie (SVG)', dlPdf: 'PDF (Druck)', dlPng: 'PNG (Druck)', dlCutDxf: 'Nur Schnittlinie (DXF)',
    dlCutout: 'Bambu Suite (PNG, transparent)', cutoutHint: 'Bambu Suite: die transparente PNG importieren und auf „Print Then Cut“ stellen — die Suite schneidet selbst an ihrem Rand entlang, keine Schnittdatei nötig ({w} × {h} mm, ohne Beschnitt).',
    cutHint: 'Drucken-und-Schneiden (z. B. Bambu Suite): eine Datei mit Bild und Schnittlinie darüber, schon ausgerichtet, in mm. Es gibt nur einen Schnitt: den Slab-Umriss.',
    e_no_card: 'Keine Karte im Bild gefunden. Die ganze Karte muss sichtbar sein, mit Hintergrund drumherum.',
    e_not_image: 'Das ist kein Bild (oder es ist zu groß).', e_too_large: 'Datei zu groß (max. {max} MB).',
    e_out_of_range: 'Ein Wert liegt außerhalb des erlaubten Bereichs.', e_unknown_option: 'Unbekannte Vorlage oder Position.',
    e_queue_full: 'Gerade ausgelastet, bitte gleich nochmal versuchen.',
  },
  fr: {
    subtitle: "Téléversez l'image finie avec la carte dedans → feuille d'impression au format slab et un seul trait de coupe autour.",
    card: 'Image (déjà étendue, carte dedans)', template: 'Modèle de format',
    placement: 'Position de la carte', plTemplate: 'Là où le slab tient la carte', plCenter: 'Centrée',
    bleed: 'Fond perdu (mm)', go: 'Créer impression + coupe', empty: 'Rien de créé pour le moment.', uploaded: 'Image téléversée',
    working: 'En cours…', done: 'Terminé', error: 'Erreur : ',
    preview: 'Trait de coupe ({w} × {h} mm)', print: 'Impression ({w} × {h} mm fond perdu compris, {dpi} dpi)',
    lowres: "L'image n'a que {d} dpi à la taille de la carte — l'impression sera floue.",
    missing: "L'image n'atteint pas le trait de coupe ({sides}) ; cette partie est complétée par un fond flou.",
    top: 'haut {v} mm', bottom: 'bas {v} mm', left: 'gauche {v} mm', right: 'droite {v} mm',
    dlPrintCut: 'Impression + coupe (SVG)', dlPdf: 'PDF (impression)', dlPng: 'PNG (impression)', dlCutDxf: 'Coupe seule (DXF)',
    dlCutout: 'Bambu Suite (PNG transparent)', cutoutHint: 'Bambu Suite : importez le PNG transparent et réglez-le sur « Print Then Cut » — la Suite découpe elle-même le long de son bord, sans fichier de coupe ({w} × {h} mm, sans fond perdu).',
    cutHint: "Impression-découpe (p. ex. Bambu Suite) : un seul fichier avec l'image et le trait de coupe par-dessus, déjà alignés, en mm. Il n'y a qu'une coupe : le contour du slab.",
    e_no_card: "Aucune carte trouvée dans l'image. La carte entière doit être visible, avec du fond autour.",
    e_not_image: "Ce n'est pas une image (ou elle est trop grande).", e_too_large: 'Fichier trop volumineux (max. {max} Mo).',
    e_out_of_range: 'Une valeur est hors limites.', e_unknown_option: 'Format ou position inconnu.',
    e_queue_full: 'Occupé pour le moment, réessayez dans un instant.',
  },
  lb: {
    subtitle: 'Fäerdegt Bild mat der Kaart dran eroplueden → Drockbou a Slab-Gréisst an eng Schneidlinn ronderëm.',
    card: 'Bild (schonn erweidert, Kaart dran)', template: 'Schabloun',
    placement: 'Positioun vun der Kaart', plTemplate: 'Wou de Slab d’Kaart hält', plCenter: 'An der Mëtt',
    bleed: 'Beschnëtt (mm)', go: 'Drock + Schneidlinn maachen', empty: 'Nach näischt gemaach.', uploaded: 'Eropgeluedent Bild',
    working: 'Gëtt gemaach…', done: 'Fäerdeg', error: 'Feeler: ',
    preview: 'Schneidlinn ({w} × {h} mm)', print: 'Drock ({w} × {h} mm mat Beschnëtt, {dpi} dpi)',
    lowres: 'D’Bild huet bei Kaartegréisst just {d} dpi — den Drock gëtt onscharf.',
    missing: 'D’Bild geet net bis un d’Schneidlinn ({sides}); do gëtt onscharfen Hannergrond ergänzt.',
    top: 'uewen {v} mm', bottom: 'ënnen {v} mm', left: 'lénks {v} mm', right: 'riets {v} mm',
    dlPrintCut: 'Drock + Schneidlinn (SVG)', dlPdf: 'PDF (Drock)', dlPng: 'PNG (Drock)', dlCutDxf: 'Just Schneidlinn (DXF)',
    dlCutout: 'Bambu Suite (PNG, transparent)', cutoutHint: 'Bambu Suite: déi transparent PNG importéieren an op „Print Then Cut“ setzen — d’Suite schneit selwer laanscht hire Rand, kee Schneid-Fichier néideg ({w} × {h} mm, ouni Beschnëtt).',
    cutHint: 'Drécken-a-Schneiden (z. B. Bambu Suite): eng Datei mam Bild an der Schneidlinn driwwer, schonn ausgeriicht, a mm. Et gëtt just ee Schnëtt: de Slab-Ëmrëss.',
    e_no_card: 'Keng Kaart am Bild fonnt. Déi ganz Kaart muss ze gesi sinn, mat Hannergrond ronderëm.',
    e_not_image: 'Dat ass kee Bild (oder et ass ze grouss).', e_too_large: 'Fichier ze grouss (max. {max} MB).',
    e_out_of_range: 'E Wäert ass ausserhalb vum Beräich.', e_unknown_option: 'Onbekannt Schabloun oder Positioun.',
    e_queue_full: 'Grad ze vill lass, probéier et gläich nach eng Kéier.',
  },
};
const $ = s => document.querySelector(s);
let lang = 'en', lastResult = null, lastStatus = null, uploadUrl = null;
const t = (key, vars = {}) => (I18N[lang][key] ?? I18N.en[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');

function setLang(l) {
  lang = I18N[l] ? l : 'en';
  document.documentElement.lang = lang;
  $('#lang').value = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  if (lastResult) show(...lastResult); else if (uploadUrl) showUpload();
  if (lastStatus) setStatus(...lastStatus);
  try { localStorage.setItem('lang', lang); } catch {}
}
function initialLang() {
  try { const saved = localStorage.getItem('lang'); if (saved) return saved; } catch {}
  return (navigator.languages || [navigator.language]).map(l => l.slice(0, 2).toLowerCase()).find(l => I18N[l]) || 'en';
}
$('#lang').addEventListener('change', e => setLang(e.target.value));

// Server errors arrive as {code, ...params}; FastAPI wraps them in "detail".
const errText = d => (d && d.code) ? t('e_' + d.code, d) : String(d);
function setStatus(kind, text) {
  lastStatus = [kind, text];
  $('#status').classList.toggle('err', kind === 'error');
  $('#stage').textContent = text;
}

function showUpload() {
  $("#out").innerHTML = `<div class="results single"><figure><img src="${uploadUrl}" alt=""><figcaption>${t('uploaded')}</figcaption></figure></div>`;
}
$('#file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (uploadUrl) URL.revokeObjectURL(uploadUrl);
  uploadUrl = f ? URL.createObjectURL(f) : null;
  $('#thumb').style.display = uploadUrl ? 'block' : 'none';
  if (uploadUrl) { $('#thumb').src = uploadUrl; lastResult = null; showUpload(); }
});

setLang(initialLang());

fetch('api/config').then(r => r.json()).then(c => {
  $('#template').innerHTML = Object.entries(c.templates)
    .map(([k, v]) => `<option value="${k}" ${k === c.default_template ? 'selected' : ''}>${v}</option>`).join('');
});
$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#go'); btn.disabled = true;
  setStatus('run', t('working'));
  try {
    const r = await fetch('api/cut', { method: 'POST', body: new FormData(e.target) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(errText(j.detail || r.statusText));
    show(j.id, j.meta);
    setStatus('done', t('done'));
  } catch (err) { setStatus('error', t('error') + err.message); }
  btn.disabled = false;
});
function show(id, m) {
  lastResult = [id, m];
  const u = n => `api/jobs/${id}/${n}`;
  const up = uploadUrl ? `<figure><img src="${uploadUrl}" alt=""><figcaption>${t('uploaded')}</figcaption></figure>` : '';
  const sides = Object.entries(m.missing_mm).filter(([, v]) => v > 0).map(([k, v]) => t(k, { v }));
  const warn = (sides.length ? `<p class="warn">${t('missing', { sides: sides.join(', ') })}</p>` : '')
    + (m.source_dpi < 200 ? `<p class="warn">${t('lowres', { d: m.source_dpi })}</p>` : '');
  $('#out').innerHTML = `
    <div class="results">
      ${up}
      <figure><img src="${u('preview.jpg')}" alt=""><figcaption>${t('preview', { w: m.size_mm[0], h: m.size_mm[1] })}</figcaption></figure>
      <figure><img src="${u('print.png')}" alt=""><figcaption>${t('print', { w: m.sheet_mm[0], h: m.sheet_mm[1], dpi: m.dpi })}</figcaption></figure>
    </div>
    ${warn}
    <div class="dl">
      <a class="cut" href="${u('cutout.png')}" download>${t('dlCutout')}</a>
      <a class="cut" href="${u('print-cut.svg')}" download>${t('dlPrintCut')}</a>
      <a href="${u('print.pdf')}" download>${t('dlPdf')}</a>
      <a href="${u('print.png')}" download>${t('dlPng')}</a>
      <a href="${u('cut.dxf')}" download>${t('dlCutDxf')}</a>
    </div>
    <p class="hint">${t('cutoutHint', { w: m.size_mm[0], h: m.size_mm[1] })}</p>
    <p class="hint">${t('cutHint')}</p>`;
}
</script>
</body>
</html>
