# Pokemon-Extender — Unraid, Compose Manager plugin
#
# Needs: "Nvidia Driver" plugin (Apps tab) and an NVIDIA GPU with 12 GB VRAM or more.
# Docker → Compose → Add New Stack → "Pokemon-Extender" → Edit Stack → Compose File:
# paste this file, put your Hugging Face token in (HF_TOKEN), save, then "Compose Up".
# Docker builds the image straight from GitHub; nothing to clone or copy.
# The first start downloads the AI model (~15 GB) into appdata; the web page shows the progress.
services:
  pokemon-extender:
    build:
      context: https://github.com/Racoon80/pokemon-extender.git#main
    image: pokemon-extender:latest
    container_name: pokemon-extender
    restart: unless-stopped
    runtime: nvidia
    ports:
      # Reachable in your LAN at http://<unraid-ip>:8000. There is no login,
      # so never forward this port to the internet.
      - "8000:8000"
    environment:
      # Hugging Face token (read access) of an account that accepted the FLUX.1 Fill licence:
      # https://huggingface.co/black-forest-labs/FLUX.1-Fill-dev
      HF_TOKEN: "hf_PUT_YOUR_TOKEN_HERE"
      # Which GPU: "all", or the GPU UUID from the Nvidia Driver plugin page if you have several.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # 12 GB VRAM: Q5_K_S (8.3 GB) fits. Out of memory → flux1-fill-dev-Q4_K_S.gguf (6.8 GB).
      FLUX_GGUF_FILE: flux1-fill-dev-Q5_K_S.gguf
      TORCH_DTYPE: auto                # bf16 on RTX 30xx and newer, float32 on older cards
      CPU_OFFLOAD: auto                # switches on below 12 GB free VRAM
      TZ: Europe/Luxembourg
    volumes:
      # AI model (~15 GB), results, own templates (templates/*.json)
      - /mnt/user/appdata/pokemon-extender:/data
    shm_size: 2gb
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8000]/"
