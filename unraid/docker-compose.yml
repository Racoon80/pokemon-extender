# Pokemon-Extender — Unraid, Compose Manager plugin. No GPU needed.
#
# Docker → Compose → Add New Stack → "Pokemon-Extender" → Edit Stack → Compose File:
# paste this file, save, then "Compose Up". Update later: "Update Stack".
# Docker builds the image straight from GitHub; nothing to clone or copy.
services:
  pokemon-extender:
    build:
      context: https://github.com/Racoon80/pokemon-extender.git#main
    image: pokemon-extender:latest
    pull_policy: build                 # built from GitHub, never pulled: "Update Stack" rebuilds the latest version
    container_name: pokemon-extender
    restart: unless-stopped
    ports:
      # Reachable in your LAN at http://<unraid-ip>:8000. There is no login,
      # so never forward this port to the internet.
      - "8000:8000"
    environment:
      TZ: Europe/Luxembourg
    volumes:
      # Results, own templates (templates/*.json)
      - /mnt/user/appdata/pokemon-extender:/data
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8000]/"
